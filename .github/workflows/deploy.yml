name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time. cancel-in-progress can leave a stale
# github-pages artifact on re-run — we suffix artifact names with run_attempt.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap lastmod needs full history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build blog
        run: npm ci && npm run build:blog

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'site/' \
            --exclude 'app-finder-worker/' \
            --exclude '.DS_Store' \
            ./ site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Unique name per attempt — avoids "Multiple artifacts named github-pages"
      # when a job is re-run (artifacts are scoped to the workflow run, not attempt).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Notify IndexNow crawlers
        continue-on-error: true
        run: |
          sleep 20
          node scripts/submit-indexnow.mjs
