name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap lastmod values come from the latest commit that changed
          # each static page, so the build needs more than a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog
        run: npm ci && npm run build:blog

      # Site lives at repo root (index.html, meetly/, hoverboard/, blog/).
      # .nojekyll is committed so GitHub Pages serves files as-is.
      # `enablement: true` creates the Pages site on first run if missing.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow (Bing + Amazon) — ask crawlers to recrawl sitemap URLs.
      # Runs after Pages is live so they can fetch /{key}.txt for ownership.
      - name: Notify IndexNow crawlers
        continue-on-error: true
        run: |
          sleep 20
          node scripts/submit-indexnow.mjs
