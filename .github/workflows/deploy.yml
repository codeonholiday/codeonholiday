name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap lastmod values come from the latest commit that changed
          # each static page, so the build needs more than a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog
        run: npm ci && npm run build:blog

      # ── GitHub Pages (apex codeonholiday.com until CF cutover) ──────────
      # Full tree including historical zip/dmg. Cloudflare gets a filtered
      # dist/ in the step below.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow (Bing + Amazon) — ask crawlers to recrawl sitemap URLs.
      # Runs after GitHub Pages is live (still the apex origin in Phase 1).
      - name: Notify IndexNow crawlers
        continue-on-error: true
        run: |
          sleep 20
          node scripts/submit-indexnow.mjs

      # ── Cloudflare Pages (codeonholiday.pages.dev) ──────────────────────
      # Filtered dist/: site + current installers only. Requires repo secrets
      # CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and
      # CLOUDFLARE_ACCOUNT_ID. See docs/cloudflare-pages.md.
      - name: Prepare Cloudflare Pages dist
        run: node scripts/prepare-pages.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codeonholiday --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
